# Security checks from ChiefGyk3D's git-your-ship-together, pinned to the
# commit under its v1.23.0 tag. Dependabot moves the pin and the comment
# together (.github/dependabot.yml).
#
# This repository holds Markdown and JSON only, so CodeQL scans the workflow
# files themselves (`actions`) and there is no Python dependency audit.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 6 * * 1'   # weekly, so new rules surface between commits
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/security.yml@e5c6ec3251cf3a6eea100a1c21736f1818d5efc7 # v1.23.0
    # GitHub checks the union of every called job's permissions before any
    # job starts, including jobs switched off below.
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      id-token: write
    with:
      codeql-languages: actions
      pip-audit-requirements: ""
      egress-policy: block
      # The repository is public, so CodeQL, Semgrep, dependency review and
      # the gitleaks upload to code scanning all run (each is on by default).
